<!DOCTYPE HTML>
<html>
<head>
	<meta charset='utf-8'>
	<meta http-equiv="content-type" content="text/html" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" href="favicon.ico" type="image/x-icon"/>
	<title>ตัวแปลงโน้ตดนตรีไทย ดรมฟ เป็นโน้ตดนตรีสากล</title>

	<link href="https://www.abcjs.net/abcjs-audio.css" media="all" rel="stylesheet" type="text/css" />
	<script src="./script/abcjs-basic-min.js" type="text/javascript"></script>
	<style>
		.abcjs-inline-audio {
			max-width: 770px;
		}
		@media print {
			h1, p, textarea, #selection, #audio, #warnings, hr {
				display: none;
			}
		}
		p {
			max-width: 600px;
		}
	</style>
</head>
<body>
<h1>ตัวแปลงโน้ตดนตรีไทย ดรมฟ เป็นโน้ตดนตรีสากล</h1>
<textarea name="thm" id="thm" cols="80" rows="15" oninput="convert2abc()">

</textarea>
<script>
    function convert2abc() {
        let thm_note = document.getElementById('thm').value;
        let converted_thm
        console.log(thm_note);

        converted_thm = thm_note

        //convert to abc
        document.getElementById('abc').value = converted_thm
    }
</script>

<textarea name="abc" id="abc" cols="80" rows="15">X:14452
    T:The £42 cheque
    M:2/4
    L:1/8
    K:G
    GG E/F/G/E/|DB, DB,|GG E/F/G/E/|DB, A,G,|GG E/F/G/E/|DB, DG/A/|BGAF|
    G2 G2:|
    A/|BG GA/B/|cB AG/A/|BGDG|BGd>c|BG GA/B/|cB AG/A/|BGAF|G2 G2:|
</textarea>

<hr />
<!-- <div id="audio"></div> -->
<!-- <div id="warnings"></div> -->
<div id="paper0" class="paper"></div>
<div id="paper1" class="paper"></div>
<div id="paper2" class="paper"></div>
<div id="paper3" class="paper"></div>
<div id="selection"></div>

<script type="text/javascript">
	function selectionCallback(abcelem) {
		var note = {};
		for (var key in abcelem) {
			if (abcelem.hasOwnProperty(key) && key !== "abselem")
				note[key] = abcelem[key];
		}
		console.log(abcelem);
		var el = document.getElementById("selection");
		el.innerHTML = "<b>selectionCallback parameter:</b><br>" + JSON.stringify(note);
	}

	function initEditor() {
		new ABCJS.Editor("abc", { paper_id: "paper0",
			synth: {
				el: "#audio",
				options: { displayLoop: true, displayRestart: true, displayPlay: true, displayProgress: true, displayWarp: true }
			},
			generate_warnings: true,
			warnings_id:"warnings",
			abcjsParams: {
				generateDownload: true,
				clickListener: selectionCallback
			}
		});
	}

	window.addEventListener("load", initEditor, false);
</script>
</body>
</html>
