<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <title>ตัวช่วยเขียนโน้ตฆ้องวง</title>

    <style>
        .table-set {
            margin-bottom: 30px;
        }

        .grid {
            border: 1px solid;
            border-collapse: collapse;
            display: grid;

            /* 8 ช่องต่อแถว */
            grid-template-columns: repeat(8, 1fr);

            gap: 5px;
        }

        .cell {
            border: 1px solid;
            display: grid;

            /* 4 input ต่อ 1 cell */
            grid-template-columns: repeat(4, 1fr);

            gap: 3px;
        }

        .cell input {
            width: 45%;
            margin: 2px;
        }
    </style>
</head>

<body>

    <h3>กำหนดจำนวนตาราง</h3>

    <input type="number" id="tableCount" value="1" min="1">

    <button onclick="generateTables()">
        ลบ=สร้างตารางใหม่
    </button>

    <button onclick="saveData()">
        แปลงเป็นตัวโน้ต
    </button>

    <br><br>

    <textarea id="output" rows="10" style="width:50%;"></textarea>

    <div id="container" style="width:100%;"></div>

<pre>
ปุ่มลัด

e = เลื่อนขึ้น
d = เลื่อนลง
f = เลื่อนไปทางขวา
s = เลื่อนไปทางซ้าย

r = ล้างข้อความและใส่เครื่องหมาย -

j = 1
k = 2
l = 3
; = 4
u = 5
i = 6
o = 7
</pre>


<script>

/* =========================================================
   สร้างตาราง
   2 แถว × 8 cell
   1 cell มี 4 input
   ดังนั้น 1 ตาราง = 16 cell = 64 input
   ========================================================= */

function generateTables() {

    const container = document.getElementById("container");

    container.innerHTML = "";

    const count =
        parseInt(document.getElementById("tableCount").value) || 1;

    for (let t = 0; t < count; t++) {

        const tableSet = document.createElement("div");

        tableSet.className = "table-set";

        const title = document.createElement("h4");

        title.textContent =
            "ตารางบรรทัดที่ " + (t + 1);

        const grid = document.createElement("div");

        grid.className = "grid";


        /*
            2 แถว × 8 cell
            = 16 cell
        */

        for (let i = 0; i < 16; i++) {

            const cell = document.createElement("div");

            cell.className = "cell";


            /*
                4 input ต่อ cell
            */

            for (let j = 0; j < 4; j++) {

                const input = document.createElement("input");

                input.type = "text";

                input.value = "-";

                input.placeholder = `#${j + 1}`;


                input.addEventListener(
                    "input",
                    saveToLocal
                );


                cell.appendChild(input);
            }

            grid.appendChild(cell);
        }


        tableSet.appendChild(title);

        tableSet.appendChild(grid);

        container.appendChild(tableSet);
    }


    setupArrowNavigation();
}


/* สร้างตารางครั้งแรก */

generateTables();

loadFromLocal();



/* =========================================================
   NOTE FREQUENCY
   ========================================================= */

const noteFreq = {

    "1": 466.16,
    "2": 523.25,
    "3": 587.33,
    "4": 622.25,
    "5": 698.46,
    "6": 783.99,
    "7": 880.00

};



/* =========================================================
   AUDIO
   ========================================================= */

const audioCtx =
    new (window.AudioContext ||
        window.webkitAudioContext)();


function playSound(freq) {

    if (!freq) return;


    /*
        ถ้า browser หยุด AudioContext
        ให้ resume ก่อน
    */

    if (audioCtx.state === "suspended") {

        audioCtx.resume();
    }


    const osc =
        audioCtx.createOscillator();

    const gain =
        audioCtx.createGain();


    osc.type = "sine";

    osc.frequency.value = freq;


    osc.connect(gain);

    gain.connect(audioCtx.destination);


    gain.gain.setValueAtTime(
        0.2,
        audioCtx.currentTime
    );


    osc.start();


    osc.stop(
        audioCtx.currentTime + 0.25
    );
}



/* =========================================================
   หาความถี่ตามแถว
   ========================================================= */

function getFrequencyByRow(note, index) {

    let freq = noteFreq[note];

    if (!freq) return null;


    /*
        1 แถวมี

        8 cell × 4 input

        = 32 input
    */

    const rowSize = 8 * 4;


    const row =
        Math.floor(index / rowSize);


    console.log(
        "index =", index,
        "row =", row
    );


    /* =====================================================
       ROW 1

       1 2 3 4 5
       เสียงสูงขึ้น 1 octave
       ===================================================== */

    if (row === 0) {

        if (
            ["1", "2", "3", "4", "5"]
                .includes(note)
        ) {

            freq *= 2;
        }
    }


    /* =====================================================
       ROW 2

       1 2 3
       เสียงสูงขึ้น 1 octave
       ===================================================== */

    if (row === 1) {

        if (
            ["1", "2", "3"]
                .includes(note)
        ) {

            freq *= 2;
        }
    }


    /*
        ไม่มี ROW 3 แล้ว
    */


    return freq;
}



/* =========================================================
   เล่นเสียงจาก input ปัจจุบัน
   ========================================================= */

function playCurrentInputSound(input, index) {

    const note =
        input.value.trim();


    const freq =
        getFrequencyByRow(
            note,
            index
        );


    if (freq) {

        playSound(freq);
    }
}



/* =========================================================
   KEYBOARD NAVIGATION
   ========================================================= */

function setupArrowNavigation() {

    const inputs =
        document.querySelectorAll(
            ".cell input"
        );


    inputs.forEach((input, index) => {

        input.addEventListener(
            "keydown",
            (e) => {


                let targetIndex = null;


                /*
                    1 แถว = 32 input

                    8 cell × 4 input
                */

                const rowSize = 8 * 4;


                /* =================================================
                   กดตัวเลข 1-7
                   ================================================= */

                if (
                    ["1", "2", "3", "4", "5", "6", "7"]
                        .includes(e.key)
                ) {

                    e.preventDefault();


                    input.value = e.key;


                    const freq =
                        getFrequencyByRow(
                            e.key,
                            index
                        );


                    if (freq) {

                        playSound(freq);
                    }


                    saveToLocal();

                    return;
                }



                /* =================================================
                   เลื่อนไปทางขวา
                   f / g
                   ================================================= */

                if (
                    e.key.toLowerCase() === "f" ||
                    e.key.toLowerCase() === "g"
                ) {

                    targetIndex =
                        index + 1;
                }


                /* =================================================
                   เลื่อนไปทางซ้าย
                   a / s / c
                   ================================================= */

                else if (
                    e.key.toLowerCase() === "a" ||
                    e.key.toLowerCase() === "s" ||
                    e.key.toLowerCase() === "c"
                ) {

                    targetIndex =
                        index - 1;
                }


                /* =================================================
                   เลื่อนลง
                   d
                   ================================================= */

                else if (
                    e.key.toLowerCase() === "d"
                ) {

                    targetIndex =
                        index + rowSize;
                }


                /* =================================================
                   เลื่อนขึ้น
                   e
                   ================================================= */

                else if (
                    e.key.toLowerCase() === "e"
                ) {

                    targetIndex =
                        index - rowSize;
                }


                /* =================================================
                   t
                   ================================================= */

                else if (
                    e.key.toLowerCase() === "t"
                ) {

                    targetIndex =
                        index - 31;
                }


                /* =================================================
                   v

                   สำหรับการเลื่อนข้ามแถว
                   ================================================= */

                else if (
                    e.key.toLowerCase() === "v"
                ) {

                    targetIndex =
                        index + 33;

                    console.log(index);
                }



                /* =================================================
                   J = 1
                   ================================================= */

                else if (
                    e.key.toLowerCase() === "j"
                ) {

                    e.preventDefault();

                    input.value = "1";

                    playCurrentInputSound(
                        input,
                        index
                    );

                    saveToLocal();

                    return;
                }



                /* =================================================
                   K = 2
                   ================================================= */

                else if (
                    e.key.toLowerCase() === "k"
                ) {

                    e.preventDefault();

                    input.value = "2";

                    playCurrentInputSound(
                        input,
                        index
                    );

                    saveToLocal();

                    return;
                }



                /* =================================================
                   L = 3
                   ================================================= */

                else if (
                    e.key.toLowerCase() === "l"
                ) {

                    e.preventDefault();

                    input.value = "3";

                    playCurrentInputSound(
                        input,
                        index
                    );

                    saveToLocal();

                    return;
                }



                /* =================================================
                   ; = 4
                   ================================================= */

                else if (
                    e.key === ";"
                ) {

                    e.preventDefault();

                    input.value = "4";

                    playCurrentInputSound(
                        input,
                        index
                    );

                    saveToLocal();

                    return;
                }



                /* =================================================
                   U = 5
                   ================================================= */

                else if (
                    e.key.toLowerCase() === "u"
                ) {

                    e.preventDefault();

                    input.value = "5";

                    playCurrentInputSound(
                        input,
                        index
                    );

                    saveToLocal();

                    return;
                }



                /* =================================================
                   I = 6
                   ================================================= */

                else if (
                    e.key.toLowerCase() === "i"
                ) {

                    e.preventDefault();

                    input.value = "6";

                    playCurrentInputSound(
                        input,
                        index
                    );

                    saveToLocal();

                    return;
                }



                /* =================================================
                   O = 7
                   ================================================= */

                else if (
                    e.key.toLowerCase() === "o"
                ) {

                    e.preventDefault();

                    input.value = "7";

                    playCurrentInputSound(
                        input,
                        index
                    );

                    saveToLocal();

                    return;
                }



                /* =================================================
                   R = ล้างช่อง
                   ================================================= */

                else if (
                    e.key.toLowerCase() === "r"
                ) {

                    e.preventDefault();

                    input.value = "-";

                    saveToLocal();

                    input.select();

                    return;
                }



                /* =================================================
                   Q = ใส่ -
                   ================================================= */

                else if (
                    e.key.toLowerCase() === "q"
                ) {

                    e.preventDefault();

                    input.value = "-";

                    saveToLocal();

                    input.select();

                    return;
                }



                /* =================================================
                   ENTER / SPACE?

                   เล่นเสียงปัจจุบัน
                   ================================================= */

                else if (
                    e.key === "Enter"
                ) {

                    e.preventDefault();

                    playCurrentInputSound(
                        input,
                        index
                    );

                    return;
                }



                /* =================================================
                   MOVE
                   ================================================= */

                if (
                    targetIndex !== null &&
                    inputs[targetIndex]
                ) {

                    e.preventDefault();

                    inputs[targetIndex].focus();

                    inputs[targetIndex].select();
                }

            }
        );

    });
}



/* =========================================================
   LOCAL STORAGE
   ========================================================= */

function saveToLocal() {

    const tables =
        document.querySelectorAll(
            ".table-set"
        );


    let data = [];


    tables.forEach((table) => {

        let tableData = [];


        const inputs =
            table.querySelectorAll(
                "input"
            );


        inputs.forEach((input) => {

            tableData.push(
                input.value
            );

        });


        data.push(tableData);

    });


    localStorage.setItem(
        "gridData",
        JSON.stringify(data)
    );
}



/* =========================================================
   LOAD LOCAL STORAGE
   ========================================================= */

function loadFromLocal() {

    const saved =
        localStorage.getItem(
            "gridData"
        );


    if (!saved) return;


    let data;


    try {

        data = JSON.parse(saved);

    } catch (e) {

        console.error(
            "ข้อมูล localStorage ไม่ถูกต้อง"
        );

        return;
    }


    const tables =
        document.querySelectorAll(
            ".table-set"
        );


    tables.forEach(
        (table, tIndex) => {

            const inputs =
                table.querySelectorAll(
                    "input"
                );


            inputs.forEach(
                (input, i) => {

                    if (
                        data[tIndex] &&
                        data[tIndex][i] !== undefined
                    ) {

                        input.value =
                            data[tIndex][i];
                    }

                }
            );

        }
    );
}



/* =========================================================
   แปลงข้อมูลเป็นตัวโน้ต
   ========================================================= */

function saveData() {

    const tables =
        document.querySelectorAll(
            ".table-set"
        );


    let result = "";


    tables.forEach(
        (table, tIndex) => {

            const inputs =
                table.querySelectorAll(
                    ".cell input"
                );


            inputs.forEach(
                (input, i) => {

                    result += input.value;


                    /*
                        จบ 1 cell
                        ทุก 4 input
                    */

                    if (
                        (i + 1) % 4 !== 0
                    ) {

                        result += "";

                    } else {

                        result += " ";
                    }


                    /*
                        จบ 1 แถว

                        8 cell × 4 input
                        = 32 input
                    */

                    if (
                        (i + 1) % 32 === 0
                    ) {

                        result += "\n";
                    }

                }
            );


            /*
                จบ 1 ตาราง
            */

            result += "\n";

        }
    );


    const cleaned =
        result
            .split("\n")
            .map(
                line => line.trimEnd()
            )
            .join("\n");


    const finalText =
        transformResult(
            cleaned
        );


    document.getElementById(
        "output"
    ).value = finalText;
}



/* =========================================================
   TRANSFORM RESULT

   ตอนนี้มีเพียง

   ROW 1
   ROW 2

   ไม่มี ROW 3
   ========================================================= */

function transformResult(text) {

    const tables =
        text.split(
            /\n\s*\n/
        );


    return tables
        .map(table => {

            const lines =
                table.split("\n");


            return lines
                .map(
                    (line, rowIndex) => {

                        if (!line.trim()) {
                            return line;
                        }


                        let cells =
                            line
                                .split(" ")
                                .map(
                                    cell =>
                                        cell.trim()
                                );


                        cells =
                            cells.map(
                                cell => {

                                    let nums =
                                        cell
                                            .split("")
                                            .map(
                                                n =>
                                                    n.trim()
                                            );


                                    nums =
                                        nums.map(
                                            n => {

                                                if (
                                                    n === "-"
                                                ) {

                                                    return n;
                                                }


                                                /*
                                                    ROW 1

                                                    1-6
                                                    เติม *
                                                */


                                                /*
                                                    ROW 2

                                                    1-3
                                                    เติม *
                                                */



                                                return n;
                                            }
                                        );


                                    return nums.join("");

                                }
                            );


                        return cells.join(" ");

                    }
                )
                .join("\n");

        })
        .join("\n\n");
}



/* =========================================================
   เล่นโน้ตตามตำแหน่ง
   ========================================================= */

function playNote(num, inputIndex) {

    if (!noteFreq[num]) {
        return;
    }


    /*
        1 แถว = 32 input
    */

    const rowSize = 8 * 4;


    const row =
        Math.floor(
            inputIndex / rowSize
        );


    let freq =
        noteFreq[num];


    /*
        ROW 1
    */

    if (
        row === 0 &&
        ["1", "2", "3", "4", "5"]
            .includes(num)
    ) {

        freq *= 2;
    }


    /*
        ROW 2
    */

    if (
        row === 1 &&
        ["1", "2", "3"]
            .includes(num)
    ) {

        freq *= 2;
    }


    playSound(freq);
}

</script>

</body>

</html>
